name: Generate OpenAPI Specs (AST Static Analysis)

on:
  push:
    branches:
      - main
      - master  # Supports both 'main' and 'master' default branches
  workflow_dispatch:  # Enables the "Run workflow" button in Actions tab for manual testing

permissions:
  contents: write  # Gives GitHub Actions permission to commit openapi.json

jobs:
  generate-spec:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Static Parser
        run: python scripts/parse_flask_routes.py

      - name: Commit openapi.json back to Repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update auto-generated openapi.json [skip ci]"
          file_pattern: "openapi.json"
